# Configuração de Deploy para Render
# https://render.com/docs/yaml-spec

services:
  # Serviço Web (Backend + Frontend)
  - type: web
    name: gerador-planos-aula
    runtime: node
    env: node
    region: oregon
    plan: free
    branch: main
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_POOL_MAX
        value: "5"
      - key: CORS_ORIGIN
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: "8h"
      - key: COOKIE_NAME
        value: copiloto_session
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: lax
      - key: AUTH_LOGIN_RATE_LIMIT_MAX
        value: "10"
      - key: AUTH_REGISTER_RATE_LIMIT_MAX
        value: "5"
      - key: AUTH_RATE_LIMIT_WINDOW_MS
        value: "900000"
      # Integrações legadas; serão removidas após o MVP.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
